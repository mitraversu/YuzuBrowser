name: Daidai build

on:
  push:
    branches: [dev, master, "arena/**"]
    paths:
      - "daidai/**"
      - ".github/workflows/daidai-build.yml"
  pull_request:
    paths:
      - "daidai/**"
      - ".github/workflows/daidai-build.yml"
  workflow_dispatch:

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daidai
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: daidai

      - name: Build
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: daidai-apks
          path: daidai/app/build/outputs/apk/**/*.apk
          retention-days: 30
