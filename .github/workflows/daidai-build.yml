name: Daidai build

on:
  push:
    branches: [dev, master, "arena/**"]
    paths:
      - "daidai/**"
      - ".github/workflows/daidai-build.yml"
  pull_request:
    paths:
      - "daidai/**"
      - ".github/workflows/daidai-build.yml"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daidai
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          set -o pipefail
          ./gradlew assembleDebug assembleRelease --stacktrace 2>&1 | tee build-output.log

      - name: Upload APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: daidai-apks
          path: daidai/app/build/outputs/apk/**/*.apk
          retention-days: 30

      # The sandbox that drives this repo cannot download Actions logs
      # (network-restricted), so on failure the log tail is reported as a
      # commit comment through the API.
      - name: Publish failure log
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "**Daidai CI build failed**"
            echo ""
            echo "### Compiler errors"
            echo '```'
            grep -E "^e: |error: " build-output.log | sed "s|file:///home/runner/work/YuzuBrowser/YuzuBrowser/daidai/||" | head -n 80 || echo "(none found)"
            echo '```'
            echo "### Log tail (30 lines)"
            echo '```'
            tail -n 30 build-output.log 2>/dev/null || echo "no build log produced"
            echo '```'
          } > comment.md
          python3 -c 'import json; print(json.dumps({"body": open("comment.md").read()}))' > payload.json
          gh api --method POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" --input payload.json || echo "comment failed"

          # best-effort branch commit as backup channel
          tail -n 400 build-output.log > ci-last-build.log 2>/dev/null || true
          git config user.name "daidai-ci"
          git config user.email "actions@users.noreply.github.com"
          git add ci-last-build.log || true
          git commit -m "ci: capture failing build log [skip ci]" || echo "nothing to commit"
          git push || echo "branch push failed"

      - name: Publish success marker
        if: success()
        run: |
          echo "BUILD OK $(date -u +%FT%TZ)" > ci-last-build.log
          git config user.name "daidai-ci"
          git config user.email "actions@users.noreply.github.com"
          git add ci-last-build.log
          git commit -m "ci: build ok [skip ci]" || echo "nothing to commit"
          git push
