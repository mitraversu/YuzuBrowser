License: Apache-2.0

AutoName: Daidai

Summary: The Yuzu Browser concept, reborn — assemble your own browser

Description: |-
    Daidai (ダイダイ, 代々 — "from generation to generation") carries the
    spirit of Yuzu Browser (2017–2021) into a modern codebase.

    Everything is an Action: the toolbar is not designed, it is assembled.
    Long-press any toolbar button to add, remove or reorder actions.

    · System WebView engine — lean and private
    · Zero telemetry, no Google Play Services
    · Hosts-based ad & tracker blocking with configurable source
    · Search engine choice (DuckDuckGo, Brave, Startpage, Google, Bing)
    · Tabs, bookmarks, find-in-page, desktop-site toggle

